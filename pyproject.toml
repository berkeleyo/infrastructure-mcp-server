[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "infrastructure-mcp-server"
version = "0.1.0"
description = "Secure read-only MCP server for multi-vendor infrastructure operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "berkeleyo"}]
dependencies = [
  "dnspython>=2.8,<3",
  "httpx>=0.28,<1",
  "mcp==2.3.0",
  "multi-vendor-infrastructure-automation @ git+https://github.com/berkeleyo/multi-vendor-infrastructure-automation.git@711fd51e11624f1a892b6ff5cb6e6bee8832a1e4",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["mypy>=1.18,<2", "pytest>=9.0.3,<10", "pytest-asyncio>=1.2,<2", "pytest-cov>=7,<8", "respx>=0.22,<1", "ruff>=0.14,<1", "types-PyYAML>=6"]

[project.scripts]
infrastructure-mcp-server = "infrastructure_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infrastructure_mcp"]
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501", "S101"]
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["infrastructure_mcp"]
[tool.pytest.ini_options]
addopts = "--strict-markers --cov=infrastructure_mcp --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

